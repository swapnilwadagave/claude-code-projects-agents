server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API: proxy to backend
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Vite static assets (JS/CSS bundles with hashed names)
    location /assets/ {
        try_files $uri =404;
    }

    # Root — serve the React SPA entry point
    location = / {
        try_files /index.html =404;
    }

    # Known React client-side routes — serve index.html directly (no internal redirect)
    location ~ ^/(login|register|dashboard)(/.*)?$ {
        try_files /index.html =404;
    }

    # Everything else is treated as a short-link slug → proxy to backend
    location / {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Referer $http_referer;
    }
}
